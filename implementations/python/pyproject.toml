[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-utils-mapped-exceptions"
version = "1.0.0rc4"
description = "Mapped exceptions utility library for Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Ze Lucio Jr" }
]
keywords = ["exceptions", "mapped-exceptions", "cae", "utils"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/clean-arch-enablers-project/cae-utils-mapped-exceptions"
Repository = "https://github.com/clean-arch-enablers-project/cae-utils-mapped-exceptions"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cae_mapped_exceptions" = ["py.typed"]